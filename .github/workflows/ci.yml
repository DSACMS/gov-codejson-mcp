name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest tests/ -v

  docker:
    name: Docker build and health check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag gov-code-mcp:ci .

      - name: Start container
        run: |
          docker run --detach \
            --name gov-code-smoke \
            --publish 127.0.0.1:8080:8080 \
            gov-code-mcp:ci

      - name: Check HTTP health endpoint
        run: |
          curl --fail --show-error --silent \
            --retry 20 \
            --retry-delay 2 \
            --retry-connrefused \
            --max-time 5 \
            http://127.0.0.1:8080/health

      - name: Show container logs
        if: always()
        run: docker logs gov-code-smoke || true

      - name: Remove container
        if: always()
        run: docker rm --force gov-code-smoke || true
